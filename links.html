<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BŪR FEST · Links</title>
  <meta name="description" content="Todos los links de BŪR FEST ¡El Parche!: boletas, marcas, ubicación e inscripciones.">
  <meta name="theme-color" content="#74C7E0">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Reemplazo del Linktree: va en la bio de Instagram (burfest.co/links) */
    body { min-height: 100svh; padding: 0 0 40px; }
    .links-wrap { position: relative; z-index: 2; width: min(480px, 100% - 32px); margin: 0 auto; padding-top: 84px; text-align: center; }
    .links-wrap .logo-big { margin: 0 auto 10px; }
    .links-wrap .hero-meta { justify-content: center; margin: 10px 0 26px; }
    .link-list { display: grid; gap: 14px; }
    .link-list a { justify-content: space-between; padding: 16px 22px; font-size: 17px; white-space: normal; text-align: left; }
    .link-list a::after { content: "→"; font-weight: 900; }
    .links-foot { margin-top: 28px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="awning" aria-hidden="true"></div>
  <div class="links-wrap">
    <div class="logo-big" aria-label="BŪR FEST ¡El parche!">
      <span class="lb-bur">BŪR</span>
      <span class="lb-fest">FEST<i>!</i></span>
      <span class="lb-parche">¡El parche!</span>
    </div>
    <div class="hero-meta">
      <span class="pill pill-pink">Bogotá · 20, 21 y 22 Nov</span>
    </div>
    <nav class="link-list">
      <a class="btn btn-yellow" href="./#boletas">🎟️ Saca tu boleta gratis</a>
      <a class="btn btn-white" href="./#marcas">🍔 Marcas participantes y votación</a>
      <a class="btn btn-white" href="./#ubicacion">📍 Ubicación y horarios</a>
      <a class="btn btn-pink" href="./#participa">⭐ Inscribe tu hamburguesería</a>
      <a class="btn btn-white" href="./#boletas">🎁 Sorteo: esta boleta se gana</a>
      <a class="btn btn-white" href="./#aliados">📣 Quiero ser aliado</a>
      <a class="btn btn-dark" href="./">Ver la web completa</a>
    </nav>
    <p class="links-foot">@burfest.col</p>
  </div>
</body>
</html>
